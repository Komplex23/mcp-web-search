services:
  - type: web
    name: mcp-web-search
    env: docker
    region: oregon          # change to: singapore | frankfurt | ohio
    plan: free              # upgrade to starter ($7/mo) to avoid spin-down
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 3000
      # ── Required for Brave Search (recommended) ──────────────────────────
      # Get a free key at https://brave.com/search/api/
      # Leave blank to use the DuckDuckGo fallback instead.
      - key: BRAVE_API_KEY
        sync: false
      # ── Optional: protect your MCP server with an API key ────────────────
      - key: MCP_API_KEY
        sync: false
