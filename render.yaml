services:
  - type: web
    name: mcp-web-search
    env: python
    region: oregon          # change to: singapore | frankfurt | ohio
    plan: free              # upgrade to starter ($7/mo) to avoid spin-down
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 3000
      # ── Required for Serper.dev (recommended) ────────────────────────────
      # Get a free key at https://serper.dev/ (2,500 searches/month free)
      # Leave blank to use the DuckDuckGo fallback instead.
      - key: SERPER_API_KEY
        sync: false
      # ── Optional: protect your MCP server with an API key ────────────────
      - key: MCP_API_KEY
        sync: false
